<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Countdown</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f8;
            color: #be185d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        #countdown {
            font-size: 4rem;
            font-weight: bold;
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(190, 24, 93, 0.15);
            font-variant-numeric: tabular-nums;
        }
        .celebrate {
            font-size: 3rem;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <h1>Tal and the princess's extra fun weekend 👑</h1>
    <div id="countdown">Loading...</div>

    <script>
        const targetDate = new Date().getTime() + (24 * 60 * 60 * 1000);

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            document.getElementById("countdown").innerHTML = `${h}:${m}:${s}`;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<div class='celebrate'>🎉 IT'S TIME! 🎉</div>";
            }
        }, 1000);
    </script>
</body>
</html>
